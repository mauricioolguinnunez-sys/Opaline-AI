<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - Opaline AI</title><link rel="stylesheet" href="css/style.css"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"></head><body>
<nav class="nav"><span class="brand">Opaline AI</span></nav>
<div class="container" style="max-width:420px">
  <div class="card">
    <h2>Iniciar sesion</h2>
    <input class="input" id="email" placeholder="Correo" style="margin-bottom:12px">
    <input class="input" id="password" type="password" placeholder="Contrasena" style="margin-bottom:12px">
    <button class="btn" onclick="login()">Entrar</button>
    <p id="msg" class="muted"></p>
    <p><a href="register.html">Crear cuenta</a></p>
  </div>
</div>
<script src="js/api.js"></script>
<script>
async function login(){
  try {
    const data = await OpalineAPI.api('/auth/login', {method:'POST', body: JSON.stringify({email:document.getElementById('email').value, password:document.getElementById('password').value})});
    OpalineAPI.setToken(data.access_token, data.refresh_token);
    window.location.href = 'cuenta.html';
  } catch(e){ document.getElementById('msg').textContent = 'Credenciales invalidas'; }
}
</script></body></html>
