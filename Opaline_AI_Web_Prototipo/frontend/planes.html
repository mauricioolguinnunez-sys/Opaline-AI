<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planes - Opaline AI</title><link rel="stylesheet" href="css/style.css"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"></head><body>
<nav class="nav"><span class="brand">Opaline AI</span><a href="index.html">Inicio</a><a href="planes.html">Planes</a><a href="chat.html">Chat</a><a href="muro.html">Muro</a></nav>
<div class="container"><h1>Planes</h1><div id="plans" class="grid cols-3"></div></div>
<script src="js/api.js"></script>
<script>
async function load(){const plans=await OpalineAPI.api('/planes');document.getElementById('plans').innerHTML=plans.map(p=>`<div class="card"><h3>${p.name}</h3><div class="plan-price">$${p.price} ${p.currency}</div><p class="muted">${p.period} · ${p.messages_per_month} msgs</p><ul>${p.features.map(f=>'<li>'+f+'</li>').join('')}</ul><a class="btn" href="checkout.html?plan=${p.id}">Comprar</a></div>`).join('');}
load();
</script></body></html>
